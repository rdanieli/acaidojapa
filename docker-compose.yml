services:
  # PostgreSQL — inventory + evolution data
  postgres:
    image: postgres:16-alpine
    container_name: acaidojapa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acaidojapa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: acaidojapa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acaidojapa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Dashboard
  dashboard:
    image: ghcr.io/rdanieli/acaidojapa/dashboard:latest
    container_name: acaidojapa-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dashboard Auth
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASS: ${DASHBOARD_PASS}
      JWT_SECRET: ${JWT_SECRET}
      PROVISION_SHARED_SECRET: ${PROVISION_SHARED_SECRET}
      # PostgreSQL (internal Docker network)
      DATABASE_URL: postgresql://acaidojapa:${DB_PASSWORD}@postgres:5432/acaidojapa
      # PDV Legal / Tablet Cloud
      PDV_API_URL: ${PDV_API_URL}
      PDV_USERNAME: ${PDV_USERNAME}
      PDV_PASSWORD: ${PDV_PASSWORD}
      PDV_CLIENT_ID: ${PDV_CLIENT_ID}
      PDV_CLIENT_SECRET: ${PDV_CLIENT_SECRET}
      PDV_COD_FILIAL: ${PDV_COD_FILIAL}
      # Cardapio Web
      CARDAPIO_TOKEN: ${CARDAPIO_TOKEN}
      CARDAPIO_API_URL: ${CARDAPIO_API_URL}
      # Groq AI
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Evolution API (internal Docker network)
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-acaidojapa}
      # Cron
      CRON_SECRET: ${CRON_SECRET}
      # WhatsApp
      WEBHOOK_SECRET: ""
    ports:
      - "127.0.0.1:3001:3001"

  # Redis — required by Evolution API
  redis:
    image: redis:7-alpine
    container_name: acaidojapa-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Evolution API — WhatsApp integration
  evolution:
    image: atendai/evolution-api:latest
    container_name: acaidojapa-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-https://evolution.divinify.app}
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - LANGUAGE=pt-BR
      - CONFIG_SESSION_PHONE_VERSION=${WA_VERSION:-2.3000.1035194821}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://acaidojapa:${DB_PASSWORD}@postgres:5432/evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  postgres_data:
  redis_data:
